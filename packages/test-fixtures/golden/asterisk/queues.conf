; BetterPBX ring groups rendered as Asterisk queues.

[general]
; Ring groups are rendered as queues. Do not edit this file by hand.

[queue-rg-sales]
strategy = rrmemory
timeout = 25000
retry = 5
ringinuse = no
maxlen = 0
announce-frequency = 0
musicclass = default
member => PJSIP/endpoint-ext-100
member => PJSIP/endpoint-ext-101

[queue-rg-support]
strategy = linear
timeout = 15000
retry = 5
ringinuse = no
maxlen = 0
announce-frequency = 0
musicclass = default
member => PJSIP/endpoint-ext-101
member => PJSIP/endpoint-ext-100
