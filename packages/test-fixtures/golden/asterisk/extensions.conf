; BetterPBX dialplan.

; The dialplan is generated only by the typed renderer. Destinations reference resource IDs,
; and every context fails closed rather than routing calls it does not understand.

[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
PBX_NAME = Acme PBX

[internal]
; Emergency numbers are explicit and take precedence over every other internal pattern.
exten => 999,1,NoOp(Emergency call 999 via primary)
 same => n,Dial(PJSIP/${EXTEN}@trunk-trunk-primary,120)
 same => n,Hangup()
exten => 112,1,NoOp(Emergency call 112 via primary)
 same => n,Dial(PJSIP/${EXTEN}@trunk-trunk-primary,120)
 same => n,Hangup()

; Feature codes.
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()
exten => *98,1,VoiceMailMain()
 same => n,Hangup()
exten => *8,1,Pickup()
 same => n,Hangup()

; Extensions, ring groups, and IVRs use exact numbers.
exten => 100,1,NoOp(Call extension Alice <100>)
 same => n,Dial(PJSIP/100,30)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?vm-busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?vm-noanswer)
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?vm-noanswer)
 same => n,Hangup()
 same => n(vm-noanswer),VoiceMail(100@default,u)
 same => n,Hangup()
 same => n(vm-busy),VoiceMail(100@default,b)
 same => n,Hangup()
exten => 101,1,NoOp(Call extension Bob <101>)
 same => n,Dial(PJSIP/101,30)
 same => n,Hangup()
exten => 600,1,NoOp(Ring group Sales <600>)
 same => n,Answer()
 same => n,Queue(queue-rg-sales,r30)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?noanswer)
 same => n,Hangup()
 same => n(noanswer),VoiceMail(100@default,u)
 same => n,Hangup()
exten => 601,1,NoOp(Ring group Support <601>)
 same => n,Answer()
 same => n,Queue(queue-rg-support,r20)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?noanswer)
 same => n,Hangup()
 same => n(noanswer),Hangup()
exten => 700,1,Goto(ivr-ivr-main,s,1)

; Outbound routes, highest priority first.
exten => _911,1,NoOp(Outbound route US emergency via primary)
 same => n,Set(OUTNUM=${EXTEN})
 same => n,Dial(PJSIP/${OUTNUM}@trunk-trunk-primary,60)
 same => n,Hangup()
exten => _1[2-8]XXNXXXXXX,1,NoOp(Outbound route National via primary)
 same => n,Set(OUTNUM=${EXTEN:1})
 same => n,Set(OUTNUM=1${OUTNUM})
 same => n,Dial(PJSIP/${OUTNUM}@trunk-trunk-primary,60)
 same => n,Hangup()
exten => _00X.,1,NoOp(Outbound route Backup via backup)
 same => n,Set(OUTNUM=${EXTEN:2})
 same => n,Set(OUTNUM=+${OUTNUM})
 same => n,Set(CALLERID(num)=15551230000)
 same => n,Dial(PJSIP/${OUTNUM}@trunk-trunk-backup,60)
 same => n,Hangup()

exten => i,1,NoOp(No matching internal destination)
 same => n,Hangup()
exten => t,1,Hangup()

[from-trunk-trunk-backup]
include => from-trunk
exten => i,1,Hangup()
exten => t,1,Hangup()

[from-trunk-trunk-primary]
exten => 15551230000,1,NoOp(Inbound route Primary DID)
 same => n,GotoIf($["${CALLERID(num)}" : "^[+]?1?555"]?allowed)
 same => n,Hangup()
 same => n(allowed),Goto(internal,700,1)
include => from-trunk
exten => i,1,Hangup()
exten => t,1,Hangup()

[from-trunk]
exten => 15559876543,1,NoOp(Inbound route Generic DID)
 same => n,Goto(internal,101,1)
exten => i,1,Hangup()
exten => t,1,Hangup()

[ivr-ivr-main]
exten => s,1,NoOp(IVR Main menu)
 same => n,Answer()
 same => n,Set(RETRIES=0)
 same => n(retry),Background(custom/welcome)
 same => n,WaitExten(6)
 same => n,Set(RETRIES=$[${RETRIES}+1])
 same => n,GotoIf($[${RETRIES} > 2]?ivr-ivr-main-timeout,s,1)
 same => n,Goto(ivr-ivr-main,s,retry,1)
exten => 1,1,Goto(internal,600,1)
exten => 2,1,VoiceMail(100@default,u)
exten => _X!,1,Goto(internal,${EXTEN},1)
exten => i,1,Set(RETRIES=$[${RETRIES}+1])
 same => n,GotoIf($[${RETRIES} > 2]?ivr-ivr-main-invalid,s,1)
 same => n,Goto(ivr-ivr-main,s,retry,1)
exten => t,1,Goto(ivr-ivr-main-timeout,s,1)
exten => h,1,Hangup()

[ivr-ivr-main-timeout]
exten => s,1,Goto(internal,101,1)
 same => n,Hangup()

[ivr-ivr-main-invalid]
exten => s,1,Hangup()

[ivr-ivr-after-hours]
exten => s,1,NoOp(IVR After hours)
 same => n,Answer()
 same => n,Set(RETRIES=0)
 same => n(retry),Background(demo-congrats)
 same => n,WaitExten(3)
 same => n,Set(RETRIES=$[${RETRIES}+1])
 same => n,GotoIf($[${RETRIES} > 1]?ivr-ivr-after-hours-timeout,s,1)
 same => n,Goto(ivr-ivr-after-hours,s,retry,1)
exten => i,1,Set(RETRIES=$[${RETRIES}+1])
 same => n,GotoIf($[${RETRIES} > 1]?ivr-ivr-after-hours-invalid,s,1)
 same => n,Goto(ivr-ivr-after-hours,s,retry,1)
exten => t,1,Goto(ivr-ivr-after-hours-timeout,s,1)
exten => h,1,Hangup()

[ivr-ivr-after-hours-timeout]
exten => s,1,Hangup()

[ivr-ivr-after-hours-invalid]
exten => s,1,Playback(ss-noservice)
 same => n,Hangup()

[default]
exten => s,1,Hangup()
exten => i,1,Hangup()
exten => t,1,Hangup()

[public]
exten => s,1,Hangup()
exten => i,1,Hangup()
exten => t,1,Hangup()
