; BetterPBX PJSIP configuration.

; Generated from the typed model. Every endpoint authenticates; no shared or unidentified
; endpoint exists. Legacy chan_sip is not built or configured.

[global]
type = global
endpoint_identifier_order = ip,username,auth_username
max_forwards = 70
user_agent = BetterPBX

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
allow_reload = yes

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /data/runtime/tls/sip.crt
priv_key_file = /data/runtime/tls/sip.key
method = tlsv1_2
cipher = AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA
verify_client = no
require_client_cert = no
allow_reload = yes

[auth-ext-100]
type = auth
auth_type = userpass
username = 100
password = alice-super-secret

[100]
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30
maximum_expiration = 3600
minimum_expiration = 60
default_expiration = 600

[100]
type = endpoint
transport = transport-tls
context = internal
disallow = all
allow = ulaw
allow = alaw
auth = auth-ext-100
aors = 100
callerid = "Alice" <100>
acl = global-acl
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no
allow_transfer = yes
allow_subscribe = yes
send_rpid = no
identify_by = auth_username,username,ip
mailboxes = 100@default

[auth-ext-101]
type = auth
auth_type = userpass
username = 101
password = bob-super-secret

[101]
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30
maximum_expiration = 3600
minimum_expiration = 60
default_expiration = 600

[101]
type = endpoint
transport = transport-udp
context = internal
disallow = all
allow = g722
allow = ulaw
auth = auth-ext-101
aors = 101
callerid = "Bob" <101>
acl = global-acl
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no
allow_transfer = yes
allow_subscribe = no
send_rpid = no
identify_by = auth_username,username,ip

[trunk-aor-trunk-backup]
type = aor
contact = sip:198.51.100.20:5060
qualify_frequency = 60
maximum_expiration = 3600
minimum_expiration = 60
default_expiration = 600

[trunk-trunk-backup]
type = endpoint
transport = transport-udp
context = from-trunk-trunk-backup
disallow = all
allow = gsm
allow = ulaw
aors = trunk-aor-trunk-backup
acl = global-acl
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no
send_pai = yes
send_rpid = no
identify_by = ip,auth_username,username

[trunk-identify-trunk-backup]
type = identify
endpoint = trunk-trunk-backup
match = 198.51.100.0/24

[trunk-auth-trunk-primary]
type = auth
auth_type = userpass
username = acme
password = provider-secret

[trunk-aor-trunk-primary]
type = aor
contact = sip:sip.provider.example:5060
qualify_frequency = 60
maximum_expiration = 3600
minimum_expiration = 60
default_expiration = 600

[trunk-trunk-primary]
type = endpoint
transport = transport-udp
context = from-trunk-trunk-primary
disallow = all
allow = ulaw
allow = alaw
aors = trunk-aor-trunk-primary
outbound_auth = trunk-auth-trunk-primary
auth = trunk-auth-trunk-primary
from_user = 15551230000
from_domain = sip.provider.example
callerid = 15551230000
acl = global-acl
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no
send_pai = yes
send_rpid = no
identify_by = ip,auth_username,username

[trunk-reg-trunk-primary]
type = registration
transport = transport-udp
server_uri = sip:sip.provider.example:5060
client_uri = sip:acme@sip.provider.example
contact_user = acme
outbound_auth = trunk-auth-trunk-primary
retry_interval = 60
forbidden_retry_interval = 600
expiration = 3600
max_retries = 10
