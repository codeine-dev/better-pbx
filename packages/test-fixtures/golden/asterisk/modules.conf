; BetterPBX module policy.

; Autoload is deliberately disabled. Only the modules listed here are loaded. The curated
; build omits legacy channel drivers, ARI/Stasis, HTTP, AMI helpers, and dialplan
; applications that can execute host commands (app_system, app_exec, app_disa, func_shell).

[modules]
autoload = no

; Timing and core plumbing.
load = res_timing_timerfd.so
load = res_pjproject.so
load = res_crypto.so
load = res_sorcery_config.so
load = res_sorcery_memory.so
load = res_sorcery_astdb.so

; SIP stack (PJSIP only; chan_sip is not built).
load = res_pjsip.so
load = res_pjsip_acl.so
load = res_pjsip_authenticator_digest.so
load = res_pjsip_outbound_authenticator_digest.so
load = res_pjsip_endpoint_identifier_ip.so
load = res_pjsip_endpoint_identifier_user.so
load = res_pjsip_outbound_registration.so
load = res_pjsip_registrar.so
load = res_pjsip_session.so
load = res_pjsip_pubsub.so
load = res_pjsip_mwi_body_generator.so
load = res_pjsip_sdp_rtp.so
load = res_pjsip_nat.so
load = res_pjsip_caller_id.so
load = res_pjsip_mwi.so
load = res_pjsip_send_to_voicemail.so
load = res_pjsip_refer.so
load = res_pjsip_diversion.so
load = res_pjsip_dtmf_info.so
load = res_pjsip_rfc3329.so
load = res_pjsip_path.so
load = res_pjsip_dlg_options.so
load = chan_pjsip.so

; Media, SRTP, and hold music. Format modules must load before res_musiconhold.
load = res_srtp.so
load = res_rtp_asterisk.so
load = codec_ulaw.so
load = codec_alaw.so
load = codec_gsm.so
load = codec_g722.so
load = codec_resample.so
load = format_wav.so
load = format_wav_gsm.so
load = format_gsm.so
load = format_sln.so
load = format_pcm.so
load = res_musiconhold.so

; Security event log consumed by fail2ban.
load = res_security_log.so

; Bridges used by Dial, queues, transfers, and hold.
load = bridge_builtin_features.so
load = bridge_builtin_interval_features.so
load = bridge_holding.so
load = bridge_native_rtp.so
load = bridge_simple.so
load = bridge_softmix.so

; Dialplan applications used by the typed renderer.
load = app_dial.so
load = app_stack.so
load = app_playback.so
load = app_voicemail.so
load = app_queue.so
load = app_read.so
load = app_senddtmf.so
load = app_verbose.so
load = app_echo.so
load = app_transfer.so
load = app_directed_pickup.so

; Dialplan functions used by generated contexts.
load = func_callerid.so
load = func_channel.so
load = func_cut.so
load = func_devstate.so
load = func_logic.so
load = func_strings.so
load = func_timeout.so
load = func_global.so

; Call detail records.
load = cdr_csv.so

; The dialplan itself. Nothing else writes extensions.conf.
load = pbx_config.so
