; BetterPBX bootstrap dialplan.
;
; The dialplan is written only by the typed renderer. Until setup and the first extension
; exist, every context fails closed rather than routing calls.
[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
PBX_NAME = BetterPBX

[internal]
exten => _X.,1,NoOp(BetterPBX bootstrap: no extensions have been configured)
 same => n,Hangup()

[from-trunk]
exten => _X.,1,NoOp(BetterPBX bootstrap: inbound call rejected until routing is configured)
 same => n,Hangup()

[default]
exten => _X.,1,Hangup()

[public]
exten => _X.,1,Hangup()
