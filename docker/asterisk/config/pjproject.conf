; BetterPBX pjproject settings. Pool caching is left on for call performance; logging is
; mapped to Asterisk's normal levels so SIP traces never reach the persistent log by default.
[startup]
cache_pools = yes

[log_mappings]
asterisk_error = 0,1
asterisk_warning = 2
asterisk_notice = 3
asterisk_verbose = 4
asterisk_debug = 5
asterisk_trace = 6
