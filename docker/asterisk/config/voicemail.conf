; BetterPBX voicemail defaults. Mailboxes are added by the renderer; the bootstrap file has
; only the default mailbox context. Voicemail is stored at /data/voicemail.
[general]
format = ulaw
serveremail = pbx@localhost
maxmsg = 100
maxsecs = 180
emaildateformat = %A, %B %d, %Y at %r
attach = no

[default]
