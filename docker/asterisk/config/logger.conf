; BetterPBX logging. Console goes to the container stdout; security goes to the structured
; file that fail2ban polls. No credentials or SIP secrets are logged at notice level.
[general]
dateformat = %F %T
use_callids = yes
queue_log = yes
queue_log_to_file = yes
queue_log_name = queue_log

[logfiles]
console => notice,warning,error
messages => notice,warning,error
security => security
sip => verbose,debug
