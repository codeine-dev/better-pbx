; BetterPBX Asterisk directory layout.
;
; All mutable state lives under /data. Image-owned assets (sound packs, modules, the
; built-in phoneprov keys) stay read-only under /var/lib/asterisk.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /data
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /data
astrundir => /run/asterisk
astlogdir => /data/log
astsbindir => /usr/sbin

[options]
; Privilege dropping is handled by the s6 run script (s6-setuidgid asterisk), so Asterisk
; must not try to setuid itself. That avoids a harmless but noisy capability warning.

astctlowner = asterisk
astctlgroup = pbx
astctlpermissions = 0660
