; BetterPBX bootstrap PJSIP configuration.
;
; There are no endpoints, auths, AORs, or identifies until the setup wizard has completed.
; UDP and TLS transports are bound so the operator can verify ports, but no anonymous or
; unauthenticated endpoint exists.
[global]
type = global
endpoint_identifier_order = ip,username,auth_usernamemax_forwards = 70
user_agent = BetterPBX

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
allow_reload = yes

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /data/runtime/tls/sip.crt
priv_key_file = /data/runtime/tls/sip.key
method = tlsv1_2
allow_reload = yes

; The API regenerates this runtime-only include when bans or whitelist entries change.
; It is intentionally outside the Git-tracked configuration tree.
#include /data/runtime/pjsip-acl.conf
