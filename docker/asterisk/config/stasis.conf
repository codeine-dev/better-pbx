; BetterPBX Stasis taskpool. Stasis is part of the core and must load, but ARI and the
; public Stasis applications are not built into this image.
[taskpool]
initial_size = 5
idle_timeout_sec = 20
max_size = 50

[declined_message_types]
; All message types are allowed. Nothing in this image publishes them externally.
